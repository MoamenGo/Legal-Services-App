name: E2E

# Browser tests for the flows in AGENTS.md section 11, against the built Worker on a local D1 with
# fake seed data. Runs on pull requests only, so it never delays a deploy or a content publish.
on:
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Local secrets for the test Worker
        # A throwaway signing key for this run only; nothing here reaches Cloudflare.
        run: echo "JWT_ACCESS_SECRET=e2e-$(openssl rand -hex 24)" > .dev.vars
      - name: Migrate, seed, export content and build
        run: pnpm e2e:prepare
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Run Playwright
        run: pnpm e2e
        env:
          CI: 1
      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14
